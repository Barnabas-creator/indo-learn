<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>印尼语学习</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/openmoji/1F4D6.svg">
<link rel="icon" href="assets/openmoji/1F4D6.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>

<footer class="attribution">
  配图来自 <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a>，
  授权 <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>
</footer>

<script type="module">
  import { API_BASE } from './lib/config.js';
  import { createServerProvider } from './lib/server-provider.js';
  import { createUnitCache } from './lib/idb-cache.js';
  import { createTts } from './lib/tts.js';
  import { start } from './app.js';

  const fetchJson = async (path) => {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) throw new Error(`加载失败：${path}`);
    return res.json();
  };

  // 接口调用：非 2xx 时把服务端错误码抛出来，视图层映射成中文
  const apiFetch = async (path, { method = 'GET', token, body } = {}) => {
    const res = await fetch(API_BASE + path, {
      method,
      headers: {
        ...(body ? { 'content-type': 'application/json' } : {}),
        ...(token ? { authorization: `Bearer ${token}` } : {}),
      },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error ?? 'server_error');
    return data;
  };

  const provider = createServerProvider({ apiFetch, storage: localStorage, cache: createUnitCache() });

  const tts = createTts({
    synth: window.speechSynthesis,
    VoiceUtterance: window.SpeechSynthesisUtterance,
  });

  // 安卓首次 getVoices() 返回空，音色要等 voiceschanged 才到齐。提前把等待发起，
  // 免得用户第一次点朗读时还要现等（tts.js 内部会缓存这个 Promise）。
  tts.whenReady?.();

  start(document.getElementById('app'), provider, tts);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { type: 'module' }).catch(() => {});
  }
</script>
</body>
</html>
