<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>印尼语学习</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/openmoji/1F4D6.svg">
<link rel="icon" href="assets/openmoji/1F4D6.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>

<footer class="attribution">
  配图来自 <a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a>，
  授权 <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>
</footer>

<script type="module">
  import { createProvider } from './lib/provider.js';
  import { createTts } from './lib/tts.js';
  import { start } from './app.js';

  const provider = createProvider({
    fetchJson: async (path) => {
      const res = await fetch(path, { cache: 'no-store' });
      if (!res.ok) throw new Error(`加载失败：${path}`);
      return res.json();
    },
    storage: localStorage,
  });

  const tts = createTts({
    synth: window.speechSynthesis,
    VoiceUtterance: window.SpeechSynthesisUtterance,
  });

  // 部分浏览器首次 getVoices() 返回空，音色列表就绪后重绘一次。
  if (window.speechSynthesis) {
    window.speechSynthesis.addEventListener?.('voiceschanged', () => {}, { once: true });
  }

  start(document.getElementById('app'), provider, tts);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { type: 'module' }).catch(() => {});
  }
</script>
</body>
</html>
