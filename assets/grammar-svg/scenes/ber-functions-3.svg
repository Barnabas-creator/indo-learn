<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200">
<style>
#tail{animation:wag 1.6s ease-in-out infinite;transform-origin:0% 100%;transform-box:fill-box}
#tail2{animation:wag2 1.4s ease-in-out infinite;transform-origin:0% 100%;transform-box:fill-box}
#eyes,#eyes2{animation:blink 3.4s ease-in-out infinite}
#kitten{animation:hop 1.8s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}
@keyframes wag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes wag2{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
</style>
<ellipse cx="130" cy="180" rx="98" ry="10" fill="#1b2e56" opacity=".08"/>
