<path d="M100 88h26" stroke="#2f55c4" stroke-width="9" stroke-linecap="round"/>
<path d="M166 84h24" stroke="#2f55c4" stroke-width="9" stroke-linecap="round"/>
<circle cx="132" cy="140" r="9" fill="#F2B45C"/>
<g id="rider">
<circle cx="140" cy="42" r="20" fill="#FFE3C4" stroke="#E0B07A" stroke-width="3"/>
