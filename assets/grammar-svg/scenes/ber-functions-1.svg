<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200">
<style>
#w1,#w2{animation:spin 1.1s linear infinite;transform-origin:center;transform-box:fill-box}
#legf{animation:pedalA 1.1s linear infinite;transform-origin:70% 10%;transform-box:fill-box}
#legb{animation:pedalB 1.1s linear infinite;transform-origin:70% 10%;transform-box:fill-box}
#rider{animation:bob 1.1s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
#dash{animation:dash 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pedalA{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes pedalB{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes dash{to{stroke-dashoffset:-40}}
</style>
<ellipse cx="130" cy="176" rx="96" ry="9" fill="#1b2e56" opacity=".08"/>
